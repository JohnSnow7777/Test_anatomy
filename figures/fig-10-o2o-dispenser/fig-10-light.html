터즈 대회(2026.10.17~12.19, 앱 회원 참가비 무료·매장 이용료 별도) 및 일반 18홀 라운드 완주 후 운동 피로도 데이터를 약국으로 역전송하여 재방문 영양 케어 선순환을 완성합니다.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {

    const e = elevation * RADIANS;

function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];

    const { sinA, cosA } = cameraOf(projection);

}

const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");

function pathOf(points, closed = false) {

function roundedPlan({ x, y, w, d, r }, steps = 8) {

        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {

        for (let step = 0; step <= count; step++) {

            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);

function signedArea(points) {

        area += ax * by - bx * ay;
    }

}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)

function runsOf(flags, want) {

                run = [index];

function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);

        const dx = bx - ax;
        const dy = by - ay;

const P = {"origin":[391.25508439381645,318.3537919770069],"scale":1.2767631619518722,"azimuth":39,"elevation":29};
const ARCHETYPES = [{"key":1,"name":"Archetype 1 · 오십견·근감소 주의 시니어 (ROM 132° · 악력 23.4kg)","hoppers":[0,3],"pack":"① 단백질·류신 + ④ MSM·콘드로이친 소분 팩","mypark":"Check-to-Play → 3/4 스윙 아크 제한 · 굵은 그립(+2mm) 처방 (1인 18홀 7,000원)","swingTurn":0.45,"gripShift":8,"shuttleDir":1},{"key":2,"name":"Archetype 2 · 혈관경직·자율신경 긴장 직장인 (PWV 9.4m/s · LF/HF 3.1)","hoppers":[1,2],"pack":"② 코엔자임Q10·오메가3 + ③ 마그네슘·테아닌 팩","mypark":"Check-to-Play → 템포 스윙 가이드 · 반경 1km 제휴 마이파크 18홀 라운드","swingTurn":0.72,"gripShift":2,"shuttleDir":1},{"key":3,"name":"Archetype 3 · 세포막 위상각·동공 반응 저하 케어 (φ 4.7° · 335ms)","hoppers":[4,5],"pack":"⑤ 포스파티딜세린(PS) + ⑥ 항산화·비타민D 팩","mypark":"Check-to-Play → 퍼팅 거리감·시각 집중 루틴 + 코어 밸런스 스탠스","swingTurn":0.62,"gripShift":4,"shuttleDir":1},{"key":4,"name":"Archetype 4 · 마이파크 제1회 챔피언쉽 마스터즈 대회 18홀 완주 회원","hoppers":[0,2,3],"pack":"① 단백질·류신 + ③ 마그네슘 + ④ MSM 리커버리 팩","mypark":"Play-to-Care ← 마스터즈 대회(10.17~12.19 · 참가비 무료·앱 회원) 18홀 피로도 약국 역전송","swingTurn":0.92,"gripShift":0,"shuttleDir":-1}];

const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const gateEls = HOPPERS.map((_, i) => svg.querySelector('[data-gate="' + i + '"]'));

const receiptEl = svg.querySelector('[data-part="receipt"]');
const upperShuttleEl = svg.querySelector('[data-part="shuttle-upper"]');

function swingNeedleAt(turn) {

  const angle = -Math.PI * 0.75 + turn * Math.PI * 1.5;
  return lineOnTop(
    [sx - Math.sin(angle) * 2.6, sy + Math.cos(angle) * 2.6],
    [sx + Math.sin(angle) * 14.2, sy - Math.cos(angle) * 14.2],
    topZ,
    P

let gripShift = ARCHETYPES[0].gripShift;

  const arch = ARCHETYPES[activeIdx];

  swingNeedleEl.setAttribute("d", swingNeedleAt(swingTurn));

  const upperX = arch.shuttleDir > 0 ? wave : -14;
  const lowerX = arch.shuttleDir < 0 ? -wave : 14;
  upperShuttleEl.setAttribute("transform", translateAlong(P, [upperX, 0, 0]));
  lowerShuttleEl.setAttribute("transform", translateAlong(P, [lowerX, 0, 0]));

  if (touring) {

    activeIdx = Math.floor(clock / 3.6) % ARCHETYPES.length;

  shuttlePhase = calm ? 0.25 : (shuttlePhase + dt * 0.45) % 1;

  const arch = ARCHETYPES[activeIdx];
  let settled = !touring && calm;
  HOPPERS.forEach((_, i) => {
    const want = arch.hoppers.includes(i) ? 5.8 : 0;
    gateHeights[i] = calm ? want : gateHeights[i] + (want - gateHeights[i]) * (1 - Math.exp(-dt / 0.16));
    if (Math.abs(want - gateHeights[i]) < 0.02) gateHeights[i] = want;

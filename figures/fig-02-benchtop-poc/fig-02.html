const MODULES = [{"id":1,"name":"1: ESP32-S3-DevKitC (250Hz NDJSON Streamer)","line1":"ESP32-S3 DUAL-CORE · 921,600 bps USB-CDC","line2":"RING-BUFFER DMA · 0% PACKET DROP · BOM 1.1만원","readout":"Module 1: ESP32-S3 250Hz NDJSON · PoC BOM 24.4만원 · 921,600 bps WebSerial · 32 Biomarkers","lidLift":24},{"id":2,"name":"2: AD5940-BIOZ (50kHz Quadripolar BIA · $22)","line1":"AD5940 SPI GPIO 8-13 · 50kHz DFT ENGINE","line2":"PHA 5.62° · R 498.4Ω · Xc 49.1Ω · BOM 5.5만원","readout":"Module 2: AD5940 SPI GPIO 8-13 ($22) · PoC BOM 24.4만원 · 50kHz Phase Angle 5.62°","lidLift":28},{"id":3,"name":"3: MAX86150 (Synchronized ECG + PPG · $15)","line1":"MAX86150 I2C GPIO 4-6 · 250Hz SYNC FIFO","line2":"PTT 241ms · HRV SDNN 48ms · BP 118/76 · BOM 3.5만원","readout":"Module 3: MAX86150 I2C GPIO 4-6 ($15) · PoC BOM 24.4만원 · PTT 241ms Cuffless BP","lidLift":28},{"id":4,"name":"4: HX711 24-Bit ADC (80SPS Grip + Weight · $9)","line1":"HX711 GPIO 17-18 · 80SPS RATE PIN HIGH","line2":"GRIP 44.2kg · RFD 108kg/s · WEIGHT 68.4kg · BOM 1.2만원","readout":"Module 4: HX711 80SPS GPIO 17-18 ($9) · PoC BOM 24.4만원 · Camry EH101 + Yolanda Load Cells","lidLift":26},{"id":5,"name":"5: ADuM3160 (2500V RMS Medical USB Isolator · $8)","line1":"ADuM3160 2500V GALVANIC ISOLATION BARRIER","line2":"IEC 60601-1 LEAKAGE < 10uA · AC HUM REJECTED · BOM 1.8만원","readout":"Module 5: ADuM3160 2500V Isolator ($8) · PoC BOM 24.4만원 · Medical-Grade Patient Protection","lidLift":12}];
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const lid = svg.querySelector('[data-part="acrylic-lid"]');

  2: svg.querySelector('[data-bus="2"]'),
  3: svg.querySelector('[data-bus="3"]'),

let lift = 22, targetLift = 24, liftVel = 0;

function draw() {
  const m = MODULES[activeIdx];
  if (lid) {
    lid.setAttribute("transform", translateAlong(P, [0, 0, lift]));
  }
  modEls.forEach((el, idx) => {
    if (!el) return;
    const isSel = idx === activeIdx;
    const zHop = isSel ? 3.2 : 0;
    el.setAttribute("transform", translateAlong(P, [0, 0, zHop]));
    el.style.opacity = isSel ? "1" : "0.78";

  Object.entries(busEls).forEach(([k, el]) => {
    if (!el) return;
    el.style.opacity = Number(k) === activeIdx ? "1" : "0.65";

  if (mon2) mon2.textContent = m.line2;

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  const calm = still.matches;
  if (touring) {
    activeIdx = Math.floor(clock / 3.2) % MODULES.length;
    targetLift = MODULES[activeIdx].lidLift;

  if (calm) {

    liftVel = 0;
  } else {
    const stiff = 190, damp = 22;
    liftVel += ((targetLift - lift) * stiff - liftVel * damp) * dt;
    lift += liftVel * dt;
    if (Math.abs(targetLift - lift) < 0.01 && Math.abs(liftVel) < 0.01) {
      lift = targetLift;
      liftVel = 0;
    }
  }
  draw();
  const busy = touring || Math.abs(targetLift - lift) > 0.01 || Math.abs(liftVel) > 0.01;
  frame = visible && busy ? requestAnimationFrame(tick) : 0;

function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}

function selectModule(idx) {
  touring = false;
  activeIdx = (idx + MODULES.length) % MODULES.length;
  targetLift = MODULES[activeIdx].lidLift;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (!still.matches) {
      touring = true;
      run();
    }
  }, 5500);
  run();

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

stage.addEventListener("pointermove", (event) => {
  const box = svg.getBoundingClientRect();
  const share = Math.max(0, Math.min(0.999, (event.clientX - box.left) / box.width));
  selectModule(Math.floor(share * MODULES.length));

svg.addEventListener("click", (event) => {

  if (mod) {

  } else {
    targetLift = targetLift > 5 ? 0 : 28;
    touring = false;
    run();
  }
  stage.focus({ preventScroll: true });

stage.addEventListener("keydown", (event) => {
  if (event.key >= "1" && event.key <= "5") {
    event.preventDefault();
    selectModule(Number(event.key) - 1);
  } else if (event.key === "ArrowRight") {
    event.preventDefault();
    selectModule(activeIdx + 1);
  } else if (event.key === "ArrowLeft") {
    event.preventDefault();
    selectModule(activeIdx - 1);
  } else if (event.key === "e" || event.key === "E") {
    event.preventDefault();
    touring = false;
    targetLift = targetLift > 5 ? 0 : 28;
    run();
  }
});
